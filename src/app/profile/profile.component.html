<div class="profile-card">

  <h2>
    Личный кабинет
  </h2>


  <label>
    Имя:

    <input
      type="text"
      [(ngModel)]="name"
      placeholder="Введите имя"
    />
  </label>


  <label>
    Пол:

    <select [(ngModel)]="sex">

      <option value="male">
        Мужской
      </option>

      <option value="female">
        Женский
      </option>

    </select>
  </label>


  <label>
    Возраст:

    <input
      type="number"
      min="1"
      max="120"
      [(ngModel)]="age"
    />

    <span>лет</span>
  </label>


  <label>
    Рост:

    <input
      type="number"
      min="50"
      max="250"
      [(ngModel)]="height"
    />

    <span>см</span>
  </label>


  <label>
    Вес:

    <input
      type="number"
      min="20"
      max="300"
      step="0.1"
      [(ngModel)]="weight"
    />

    <span>кг</span>
  </label>


  <label>
    Уровень активности:

    <select [(ngModel)]="activityLevel">

      <option value="low">
        Низкая
      </option>

      <option value="medium">
        Средняя
      </option>

      <option value="high">
        Высокая
      </option>

    </select>
  </label>


  <label>
    Цель:

    <select [(ngModel)]="goal">

      <option value="lose">
        Снижение веса
      </option>

      <option value="maintain">
        Поддержание веса
      </option>

      <option value="gain">
        Набор веса
      </option>

    </select>
  </label>


  <label class="checkbox">

    <input
      type="checkbox"
      [(ngModel)]="isDiabetic"
    />

    Я — диабетик

  </label>


  <div class="controls">

    <button
      class="btn"
      type="button"
      (click)="save()"
    >
      Сохранить
    </button>


    <a
      class="back"
      routerLink="/"
    >
      На главную
    </a>

  </div>


  <div
    class="saved-box"
    *ngIf="saved"
  >
    ✔ Данные сохранены!
  </div>

</div>
